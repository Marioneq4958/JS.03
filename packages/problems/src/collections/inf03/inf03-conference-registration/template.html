<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejestracja konferencji Nasze Kwiaty</title>
    <style>
      * {
        font-family: sans-serif;
      }

      #blok2,
      #blok3 {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="blok1">
      <h2>Dane osobowe</h2>
      <input type="text" id="imie" placeholder="Wpisz imię..." required />
      <input type="text" id="nazwisko" placeholder="Wpisz nazwisko..." required />
      <button id="nastepna1">Następna karta</button>
    </div>

    <div id="blok2">
      <h2>Dane kontaktowe</h2>
      <input type="email" id="email" placeholder="Twój e-mail..." />
      <input type="tel" id="telefon" placeholder="Twój numer telefonu..." />
      <button id="nastepna2">Następna karta</button>
    </div>

    <div id="blok3">
      <h2>Hasło do logowania</h2>
      <input type="password" id="haslo" placeholder="Podaj hasło" />
      <input type="password" id="powtorzHaslo" placeholder="Powtórz hasło" />
      <button id="zatwierdz">Zatwierdź</button>
    </div>

    <script>
      // Skrypt
    </script>
  </body>
</html>
