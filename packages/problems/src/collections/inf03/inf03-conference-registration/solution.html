<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejestracja konferencji Nasze Kwiaty</title>
    <style>
      * {
        font-family: sans-serif;
      }

      #blok2,
      #blok3 {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="blok1">
      <h2>Dane osobowe</h2>
      <input type="text" id="imie" placeholder="Wpisz imię..." required />
      <input type="text" id="nazwisko" placeholder="Wpisz nazwisko..." required />
      <button id="nastepna1" onclick="pokazBlok2()">Następna karta</button>
    </div>

    <div id="blok2">
      <h2>Dane kontaktowe</h2>
      <input type="email" id="email" placeholder="Twój e-mail..." />
      <input type="tel" id="telefon" placeholder="Twój numer telefonu..." />
      <button id="nastepna2" onclick="pokazBlok3()">Następna karta</button>
    </div>

    <div id="blok3">
      <h2>Hasło do logowania</h2>
      <input type="password" id="haslo" placeholder="Podaj hasło" />
      <input type="password" id="powtorzHaslo" placeholder="Powtórz hasło" />
      <button id="zatwierdz" onclick="zatwierdz()">Zatwierdź</button>
    </div>

    <script>
      function pokazBlok2() {
        document.getElementById('blok1').style.display = 'none';
        document.getElementById('blok2').style.display = 'block';
      }

      function pokazBlok3() {
        document.getElementById('blok2').style.display = 'none';
        document.getElementById('blok3').style.display = 'block';
      }

      function zatwierdz() {
        let haslo = document.getElementById('haslo').value;
        let powtorzHaslo = document.getElementById('powtorzHaslo').value;

        if (haslo !== powtorzHaslo) {
          alert('Podane hasła różnią się');
        } else {
          let imie = document.getElementById('imie').value;
          let nazwisko = document.getElementById('nazwisko').value;
          console.log('Witaj ' + imie + ' ' + nazwisko);
        }
      }
    </script>
  </body>
</html>
