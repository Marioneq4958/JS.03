<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salon piękności</title>
    <style>
      * {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <h3>Kalkulator ceny wizyty</h3>

    <input type="checkbox" id="peeling" />
    <label for="peeling">Peeling</label>
    <br />

    <input type="checkbox" id="maska" />
    <label for="maska">Maska</label>
    <br />

    <input type="checkbox" id="masaz" />
    <label for="masaz">Masaż twarzy</label>
    <br />

    <input type="checkbox" id="makijaz" />
    <label for="makijaz">Makijaż</label>
    <br />

    <button id="oblicz" onclick="obliczCene()">Oblicz cenę</button>
    <p id="wynik"></p>

    <script>
      function obliczCene() {
        let suma = 0;
        if (document.getElementById('peeling').checked) suma += 45;
        if (document.getElementById('maska').checked) suma += 30;
        if (document.getElementById('masaz').checked) suma += 20;
        if (document.getElementById('makijaz').checked) suma += 50;

        document.getElementById('wynik').innerHTML = 'Cena zabiegów: ' + suma;
      }
    </script>
  </body>
</html>
