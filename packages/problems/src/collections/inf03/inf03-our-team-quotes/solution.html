<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasz zespół</title>
    <style>
      * {
        font-family: sans-serif;
      }

      blockquote {
        cursor: pointer;
      }

      #cytat2,
      #cytat3 {
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>Nasz zespół</h2>

    <blockquote id="cytat1" onclick="pokazNastepny1()">
      <p>„Praca zespołowa to klucz do sukcesu."</p>
      <p>Anna</p>
    </blockquote>

    <blockquote id="cytat2" onclick="pokazNastepny2()">
      <p>„Razem możemy osiągnąć więcej."</p>
      <p>Marek</p>
    </blockquote>

    <blockquote id="cytat3" onclick="pokazNastepny3()">
      <p>„Każdy krok naprzód jest krokiem ku lepszemu."</p>
      <p>Kasia</p>
    </blockquote>

    <script>
      function pokazNastepny1() {
        document.getElementById('cytat1').style.display = 'none';
        document.getElementById('cytat2').style.display = 'block';
      }

      function pokazNastepny2() {
        document.getElementById('cytat2').style.display = 'none';
        document.getElementById('cytat3').style.display = 'block';
      }

      function pokazNastepny3() {
        document.getElementById('cytat3').style.display = 'none';
        document.getElementById('cytat1').style.display = 'block';
      }
    </script>
  </body>
</html>
