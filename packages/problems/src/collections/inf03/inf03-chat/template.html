<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
      * {
        font-family: sans-serif;
      }

      .jolka {
        background-color: #eee;
      }

      .jolka img {
        float: left;
      }

      .krzysiek {
        background-color: #ccc;
        text-align: right;
      }

      .krzysiek img {
        float: right;
      }

      input {
        width: 60%;
      }

      #chat {
        height: 470px;
        overflow: scroll;
        border: 1px solid tomato;
      }

      #chat div {
        height: 50px;
        padding: 5px;
      }

      img {
        height: 50px;
        width: 50px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="chat">
      <div class="jolka">
        <img src="Jolka.jpg" />
        <p>Cześć idziesz jutro do kina?</p>
      </div>
      <div class="krzysiek">
        <img src="Krzysiek.jpg" />
        <p>Tak! A ty?</p>
      </div>
    </div>

    <label for="tresc">Wpisz wiadomość:</label>
    <input type="text" id="tresc" />
    <button id="przycisk-wyslij">Wyślij</button>
    <br />
    <button id="przycisk-generuj">Generuj losową odpowiedź</button>

    <script>
      // Skrypt
    </script>
  </body>
</html>
