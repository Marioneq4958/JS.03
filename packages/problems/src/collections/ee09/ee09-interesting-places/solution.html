<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria</title>
    <style>
      * {
        font-family: sans-serif;
      }

      main {
        text-align: center;
      }

      main img {
        max-height: 200px;
      }

      #miniatury img {
        max-height: 80px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="lanzarotte.jpg" alt="galeria" id="glowny-obraz" />
    </main>

    <section id="miniatury">
      <h3>Przeglądaj zdjęcia</h3>
      <img id="obraz1" onclick="ustawObraz('lanzarotte.jpg')" src="lanzarotte.jpg" alt="lanzarotte" />
      <img id="obraz2" onclick="ustawObraz('pekin.jpg')" src="pekin.jpg" alt="pekin" />
      <img id="obraz3" onclick="ustawObraz('serengeti.jpg')" src="serengeti.jpg" alt="Serengeti" />
      <img id="obraz4" onclick="ustawObraz('wenecja.jpg')" src="wenecja.jpg" alt="Wenecja" />
      <img id="obraz5" onclick="ustawObraz('tajlandia.jpg')" src="tajlandia.jpg" alt="Tajlandia" />
    </section>

    <section>
      <p>
        Polub nas
        <img src="icon-off.png" id="ikona" onclick="zmienIkone()" />
      </p>
    </section>

    <script>
      function zmienIkone() {
        let ikona = document.getElementById('ikona');
        if (ikona.src.includes('icon-off.png')) {
          ikona.src = 'icon-on.png';
        } else {
          ikona.src = 'icon-off.png';
        }
      }

      function ustawObraz(nazwa) {
        document.getElementById('glowny-obraz').src = nazwa;
      }
    </script>
  </body>
</html>
