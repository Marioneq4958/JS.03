<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nasze zdjęcia</title>
    <style>
      * {
        font-family: sans-serif;
      }

      #gorny img {
        width: 30%;
      }

      img {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Panel prawy, górny -->
    <section id="gorny">
      <h2>Kliknij na zdjęcie</h2>
      <img
        id="pies1"
        src="pies1.jpg"
        alt="psy"
        onmouseover="ustawMiniature('pies1', 'pies1-odbicie.jpg')"
        onmouseout="ustawMiniature('pies1', 'pies1.jpg')"
        onclick="kliknieto('pies1', 'pies1.jpg')"
      />
      <img
        id="pies2"
        src="pies2.jpg"
        alt="psy"
        onmouseover="ustawMiniature('pies2', 'pies2-odbicie.jpg')"
        onmouseout="ustawMiniature('pies2', 'pies2.jpg')"
        onclick="kliknieto('pies2', 'pies2.jpg')"
      />
      <img
        id="pies3"
        src="pies3.jpg"
        alt="psy"
        onmouseover="ustawMiniature('pies3', 'pies3-odbicie.jpg')"
        onmouseout="ustawMiniature('pies3', 'pies3.jpg')"
        onclick="kliknieto('pies3', 'pies3.jpg')"
      />
    </section>

    <!-- Panel prawy, dolny -->
    <section id="dolny">
      <img id="pies-glowny" src="pies2.jpg" alt="Wybrany pies" />
    </section>

    <script>
      function ustawMiniature(idMiniatury, obraz) {
        let miniatura = document.getElementById(idMiniatury);
        miniatura.src = obraz;
      }

      function kliknieto(idMiniatury, obraz) {
        let miniatura = document.getElementById(idMiniatury);
        miniatura.src = obraz;

        let glowny = document.getElementById('pies-glowny');
        glowny.src = obraz;
      }
    </script>
  </body>
</html>
